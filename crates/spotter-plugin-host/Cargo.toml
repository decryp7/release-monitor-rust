[package]
name = "spotter-plugin-host"
description = "Spotter's plugin host (ADR 0003): discovers plugins, runs each request in a guarded child process (handshake, timeouts, memory limit, crash attribution, quarantine), and the bounded child-process helper"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors = ["decryp7"]
publish = false

[dependencies]
spotter-core.workspace = true
spotter-plugin-api.workspace = true
serde.workspace = true
sysinfo.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

# A plugin that misbehaves on purpose (crash, hang, garbage, memory, wrong id, old protocol), chosen by the name it is
# copied to. Used only by the tests; never bundled.
[[bin]]
name = "spotter-fake-plugin"
path = "src/bin/fake_plugin.rs"
test = false

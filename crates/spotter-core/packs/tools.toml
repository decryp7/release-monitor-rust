# Built-in presets (real public projects). Spotter reads each project's public release list; nothing is sent about you.

[[preset]]
id = "ripgrep"
name = "ripgrep"
description = "Fast recursive search."
category = "Command-line tools"
source = { kind = "github", values = { repo = "BurntSushi/ripgrep" } }


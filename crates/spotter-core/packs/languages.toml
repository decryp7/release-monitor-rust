# Built-in presets (real public projects). Spotter reads each project's public release list; nothing is sent about you.

[[scheme]]
id = "go"
name = "Go toolchain tags (go1.23.1, go1.24rc1)"
pattern = 'go(?<major>\d+)\.(?<minor>\d+)(?:\.(?<patch>\d+))?(?:(?<pre>rc\d+|beta\d+))?'

[[preset]]
id = "rust"
name = "Rust"
description = "The Rust compiler and standard library."
category = "Languages"
source = { kind = "github", values = { repo = "rust-lang/rust" } }

[[preset]]
id = "node"
name = "Node.js"
description = "JavaScript runtime (release tags)."
category = "Languages"
source = { kind = "feed", values = { url = "https://github.com/nodejs/node/tags.atom" } }

[[preset]]
id = "go"
name = "Go"
description = "The Go toolchain (release tags)."
category = "Languages"
source = { kind = "feed", values = { url = "https://github.com/golang/go/tags.atom" } }
versions = "go"

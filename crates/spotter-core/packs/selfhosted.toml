# Built-in presets (real public projects). Spotter reads each project's public release list; nothing is sent about you.

[[preset]]
id = "home-assistant"
name = "Home Assistant"
description = "Open source home automation."
category = "Self-hosting"
source = { kind = "github", values = { repo = "home-assistant/core" } }


# Built-in presets (real public projects). Spotter reads each project's public release list; nothing is sent about you.

[[preset]]
id = "serde"
name = "serde (crates.io)"
description = "The Rust serialisation framework, as a package-registry example."
category = "Package registries"
source = { kind = "package", values = { registry = "crates-io", package = "serde" } }

[[preset]]

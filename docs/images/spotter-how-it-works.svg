    </radialGradient>
    <linearGradient id="svedge" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.4"/><stop offset="0.3" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.75" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <clipPath id="svclip"><path d="M383.41 100H640.59C722.19 100 763 100 806.92 113.89C854.88 131.34 892.66 169.12 910.11 217.08C924 261 924 301.81 924 383.41V640.59C924 722.19 924 763 910.11 806.92C892.66 854.88 854.88 892.66 806.92 910.11C763 924 722.19 924 640.59 924H383.41C301.81 924 261 924 217.08 910.11C169.12 892.66 131.34 854.88 113.89 806.92C100 763 100 722.19 100 640.59V383.41C100 301.81 100 261 113.89 217.08C131.34 169.12 169.12 131.34 217.08 113.89C261 100 301.81 100 383.41 100Z"/></clipPath>
    <filter id="svgs" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#7A4E00" flood-opacity="0.18"/></filter>
    <filter id="svts" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/></filter>
    <mask id="svm0" maskUnits="userSpaceOnUse" x="-2000" y="-2000" width="5000" height="5000"><rect x="-2000" y="-2000" width="5000" height="5000" fill="#fff"/><path d="M310 604a62 62 0 1 1 124 0a62 62 0 1 1 -124 0Z" fill="#000"/><path d="M590 604a62 62 0 1 1 124 0a62 62 0 1 1 -124 0Z" fill="#000"/></mask>
  </defs>
  <path d="M383.41 100H640.59C722.19 100 763 100 806.92 113.89C854.88 131.34 892.66 169.12 910.11 217.08C924 261 924 301.81 924 383.41V640.59C924 722.19 924 763 910.11 806.92C892.66 854.88 854.88 892.66 806.92 910.11C763 924 722.19 924 640.59 924H383.41C301.81 924 261 924 217.08 910.11C169.12 892.66 131.34 854.88 113.89 806.92C100 763 100 722.19 100 640.59V383.41C100 301.81 100 261 113.89 217.08C131.34 169.12 169.12 131.34 217.08 113.89C261 100 301.81 100 383.41 100Z" fill="url(#svbg)" filter="url(#svts)"/>
  <g clip-path="url(#svclip)">
    <path d="M60 907.52L907.52 60L1022.8800000000001 60L60 1022.8800000000001Z" fill="#FFFFFF" opacity="0.16"/>
    <path d="M60 1080.56L1080.56 60L1113.52 60L60 1113.52Z" fill="#FFFFFF" opacity="0.17600000000000002"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#svsheen)"/>
    <path d="M383.41 100H640.59C722.19 100 763 100 806.92 113.89C854.88 131.34 892.66 169.12 910.11 217.08C924 261 924 301.81 924 383.41V640.59C924 722.19 924 763 910.11 806.92C892.66 854.88 854.88 892.66 806.92 910.11C763 924 722.19 924 640.59 924H383.41C301.81 924 261 924 217.08 910.11C169.12 892.66 131.34 854.88 113.89 806.92C100 763 100 722.19 100 640.59V383.41C100 301.81 100 261 113.89 217.08C131.34 169.12 169.12 131.34 217.08 113.89C261 100 301.81 100 383.41 100Z" fill="none" stroke="url(#svedge)" stroke-width="6"/>
    
  </g>
  <g filter="url(#svgs)" transform="translate(512 512) scale(1) translate(-512 -512)"><path d="M248 604a124 124 0 1 1 248 0a124 124 0 1 1 -248 0ZM528 604a124 124 0 1 1 248 0a124 124 0 1 1 -248 0ZM336 372H408A36 36 0 0 1 444 408V568A36 36 0 0 1 408 604H336A36 36 0 0 1 300 568V408A36 36 0 0 1 336 372ZM616 372H688A36 36 0 0 1 724 408V568A36 36 0 0 1 688 604H616A36 36 0 0 1 580 568V408A36 36 0 0 1 616 372ZM466 432H558A30 30 0 0 1 588 462V498A30 30 0 0 1 558 528H466A30 30 0 0 1 436 498V462A30 30 0 0 1 466 432Z" fill="#3A2600" mask="url(#svm0)"/><g opacity="0.55"><path d="M336 300H408A20 20 0 0 1 428 320V336A20 20 0 0 1 408 356H336A20 20 0 0 1 316 336V320A20 20 0 0 1 336 300ZM616 300H688A20 20 0 0 1 708 320V336A20 20 0 0 1 688 356H616A20 20 0 0 1 596 336V320A20 20 0 0 1 616 300Z" fill="#3A2600"/></g><path d="M792 236C796.5 282 810 295.5 856 300C810 304.5 796.5 318 792 364C787.5 318 774 304.5 728 300C774 295.5 787.5 282 792 236Z" fill="#3A2600"/></g>
</svg><text class="name" x="132" y="68" style="font-size:28px">How Spotter works</text>
<circle class="accfill" cx="224" cy="188" r="44"/><g class="gl" transform="translate(206 170) scale(1.5)"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></g><path class="conn" d="M282 188 L446 188"/><path class="chev" d="M440 182 l7 6 -7 6"/><text class="stepn" x="224" y="272" text-anchor="middle">STEP 1</text><text class="stept" x="224" y="302" text-anchor="middle">Watch any source</text><text class="steps" x="224" y="330" text-anchor="middle">Folders, feeds, forges,</text><text class="steps" x="224" y="358" text-anchor="middle">APIs and web pages.</text>
<circle class="accfill" cx="512" cy="188" r="44"/><g class="gl" transform="translate(494 170) scale(1.5)"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.2"/></g><path class="conn" d="M570 188 L734 188"/><path class="chev" d="M728 182 l7 6 -7 6"/><text class="stepn" x="512" y="272" text-anchor="middle">STEP 2</text><text class="stept" x="512" y="302" text-anchor="middle">Extract the version</text><text class="steps" x="512" y="330" text-anchor="middle">Declarative packs and</text><text class="steps" x="512" y="358" text-anchor="middle">your own patterns.</text>
<circle class="accfill" cx="800" cy="188" r="44"/><g class="gl" transform="translate(782 170) scale(1.5)"><path d="M12 4v16M5 8h14M5 8l-3 7h6zM19 8l-3 7h6z"/></g><path class="conn" d="M858 188 L1022 188"/><path class="chev" d="M1016 182 l7 6 -7 6"/><text class="stepn" x="800" y="272" text-anchor="middle">STEP 3</text><text class="stept" x="800" y="302" text-anchor="middle">Decide the latest</text><text class="steps" x="800" y="330" text-anchor="middle">Applies your filters and</text><text class="steps" x="800" y="358" text-anchor="middle">soak time.</text>
<circle class="accfill" cx="1088" cy="188" r="44"/><g class="gl" transform="translate(1070 170) scale(1.5)"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></g><path class="conn" d="M1146 188 L1310 188"/><path class="chev" d="M1304 182 l7 6 -7 6"/><text class="stepn" x="1088" y="272" text-anchor="middle">STEP 4</text><text class="stept" x="1088" y="302" text-anchor="middle">Notify</text><text class="steps" x="1088" y="330" text-anchor="middle">Digests and quiet hours,</text><text class="steps" x="1088" y="358" text-anchor="middle">through the OS.</text>
<circle class="accfill" cx="1376" cy="188" r="44"/><g class="gl" transform="translate(1358 170) scale(1.5)"><path d="M12 4v11M7.5 11 12 15.5 16.5 11M5 20h14"/></g><text class="stepn" x="1376" y="272" text-anchor="middle">STEP 5</text><text class="stept" x="1376" y="302" text-anchor="middle">Act</text><text class="steps" x="1376" y="330" text-anchor="middle">Open the release or</text><text class="steps" x="1376" y="358" text-anchor="middle">download it.</text>
<line x1="80" x2="1520" y1="434" y2="434" stroke="var(--line)"/>
<text class="small" x="80" y="472">Spotter can ask Pitwall for what-is-new summaries and keeps Pitcrew runners current.</text>
</svg>